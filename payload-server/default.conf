server {
    listen 80;
    server_name _;
    
    absolute_redirect off;

    location = /start {
        return 302 /training.txt;
    }

    location = /training.txt {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "SOC LAB: harmless training payload\n";
    }

    location / {
        return 404;
    }
}
