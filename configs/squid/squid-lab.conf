# SOC LAB - Drive-by Download Prevention

# Chi cho phep client tren may Ubuntu
http_port 127.0.0.1:3128

# Chi chap nhan ket noi tu localhost
acl lab_client src 127.0.0.1/32

# Endpoint mo phong can chan
acl malicious_path urlpath_regex -i ^/start(\?.*)?$

# Dia chi dich cua LAB
acl lab_target dst 127.0.0.1/32

# Chi cho phep HTTP
acl allowed_ports port 80 8088 8089
acl connect_method method CONNECT

# Chan request ngoai port cho phep
http_access deny !allowed_ports
http_access deny connect_method

# Chan endpoint Drive-by Download
http_access deny lab_client lab_target malicious_path

# Cho phep truy cap cac URL LAB con lai
http_access allow lab_client lab_target

# Chan tat ca request khac
http_access deny all

access_log stdio:/var/log/squid/access.log

visible_hostname ubuntu-soc-proxy
